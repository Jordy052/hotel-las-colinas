<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061d23">
  <meta name="description" content="Bienvenido a Hotel Las Colinas, Puerto Cabezas, Nicaragua.">
  <link rel="icon" type="image/svg+xml" href="./usuario/img/hotel-las-colinas.svg">
  <title>Bienvenido | Hotel Las Colinas</title>
  <noscript><meta http-equiv="refresh" content="2;url=usuario/html/index.html"></noscript>
  <style>
    :root {color-scheme:dark;font-family:"Segoe UI",Arial,sans-serif;background:#061d23;color:#f7fbfa;}
    * {box-sizing:border-box;}
    body {margin:0;min-width:280px;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:1fr auto;background:radial-gradient(ellipse at 50% 42%,#10454c 0%,#08272e 36%,#061d23 72%);}
    main {position:relative;display:grid;place-items:center;min-height:0;padding:48px 24px;overflow:hidden;}
    .halo {position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,#e8b45b10,transparent 52%);opacity:0;animation:illuminate 1.7s ease-out both;}
    .intro {position:relative;width:min(100%,640px);text-align:center;animation:reveal 850ms cubic-bezier(.2,.7,.3,1) both;}
    .emblem {position:relative;display:grid;place-items:center;width:142px;height:142px;margin:0 auto 30px;}
    .emblem:before {content:"";position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,#efbc5825,transparent 70%);animation:illuminate 1.4s ease-out both;}
    .logo {position:relative;width:120px;height:120px;filter:drop-shadow(0 12px 28px #0007);animation:mark-in 1000ms cubic-bezier(.16,1,.3,1) both;}
    .eyebrow {margin:0 0 12px;color:#e7bb73;font-size:11px;font-weight:600;letter-spacing:5px;animation:reveal 900ms 150ms both;}
    h1 {margin:0;color:#f8fbf9;font-size:clamp(26px,5.8vw,47px);font-weight:600;line-height:1.2;letter-spacing:clamp(2px,.6vw,5px);text-transform:uppercase;}
    .location {margin:15px 0 0;color:#b1c8cb;font-size:12px;letter-spacing:2.5px;line-height:1.7;}
    .line {width:54px;height:1px;margin:26px auto;background:#efbc5899;}
    .welcome {margin:0;color:#d4e2e3;font-size:14px;letter-spacing:.4px;}
    .loading {width:116px;height:2px;margin:31px auto 0;border-radius:3px;overflow:hidden;background:#afc8cc26;}
    .loading:after {content:"";display:block;width:100%;height:100%;background:#efbc58;transform-origin:left;animation:progress 1750ms ease-in-out both;}
    footer {position:relative;padding:10px 24px 26px;text-align:center;}
    .skip {display:inline-block;padding:10px 18px;border:1px solid #b3c9cc38;border-radius:24px;color:#d9e7e9;text-decoration:none;font-size:12px;transition:background .15s,border-color .15s;}
    .skip:hover {background:#ffffff0d;border-color:#e7bb7388;}
    .skip:focus-visible {outline:2px solid #efbc58;outline-offset:5px;}
    .skip span {margin-left:9px;}
    body.leaving main {opacity:0;transform:scale(1.025);transition:opacity .3s ease,transform .3s ease;}
    @keyframes reveal {from {opacity:0;transform:translateY(12px);}to {opacity:1;transform:translateY(0);}}
    @keyframes mark-in {from {opacity:0;transform:scale(.78);}to {opacity:1;transform:scale(1);}}
    @keyframes illuminate {from {opacity:0;}to {opacity:1;}}
    @keyframes progress {from {transform:scaleX(0);}to {transform:scaleX(1);}}
    @media(max-height:500px) {.emblem {width:82px;height:82px;margin-bottom:14px;}.logo {width:72px;height:72px;}main {padding:24px 18px;}.line {margin:14px auto;}.loading {margin-top:18px;}footer {padding-bottom:14px;}}
    @media(prefers-reduced-motion:reduce) {*,*:before,*:after {animation:none!important;transition:none!important;}body.leaving main {opacity:1;transform:none;}}
  </style>
</head>
<body>
  <main aria-labelledby="hotel-name">
    <div class="halo" aria-hidden="true"></div>
    <section class="intro">
      <div class="emblem"><img class="logo" src="./usuario/img/hotel-las-colinas.svg" alt="Logo de Hotel Las Colinas" width="120" height="120"></div>
      <p class="eyebrow">BIENVENIDO</p>
      <h1 id="hotel-name">Hotel Las Colinas</h1>
      <p class="location">PUERTO CABEZAS · NICARAGUA</p>
      <div class="line" aria-hidden="true"></div>
      <p class="welcome">Tu estancia comienza aquí.</p>
      <div class="loading" aria-hidden="true"></div>
    </section>
  </main>
  <footer><a class="skip" href="./usuario/html/index.html">Entrar ahora<span aria-hidden="true">→</span></a></footer>
  <script>
    "use strict";
    // Relative navigation supports GitHub Pages project paths and local opening.
    const destination = new URL("./usuario/html/index.html", window.location.href);
    window.setTimeout(() => document.body.classList.add("leaving"), 1700);
    window.setTimeout(() => window.location.replace(destination.href), 2000);
  </script>
</body>
</html>
