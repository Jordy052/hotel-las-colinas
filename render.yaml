services:
  - type: web
    name: hotel-las-colinas-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: HOTEL_ALLOWED_ORIGINS
        value: https://jordy052.github.io,http://127.0.0.1:5500,http://localhost:5500
      - key: HOTEL_PUBLIC_BASE_URL
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL
        value: "true"
      - key: MYSQL_SSL_CA_PEM
        sync: false
      - key: HOTEL_PASSWORD_RESET_SECRET
        generateValue: true
